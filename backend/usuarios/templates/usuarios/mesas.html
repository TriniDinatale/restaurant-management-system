{% extends "usuarios/base.html" %}
{% block title %}Mesas · Gestión del restaurante{% endblock %}
{% block page_name %}mesas{% endblock %}
{% block content %}
<header class="topbar">
    <a class="brand" href="/" aria-label="Gestión del restaurante, inicio">
        <span class="brand-mark brand-mark-small" aria-hidden="true">R</span>
        <span>Restaurante</span>
    </a>
    <div class="user-tools">
        <span id="user-label" class="user-label">Cargando usuario…</span>
        <button id="logout-button" class="button button-quiet" type="button">
            Cerrar sesión
        </button>
    </div>
</header>
<main class="page-shell">
    <section class="page-heading">
        <div>
            <p class="eyebrow">OPERACIÓN</p>
            <h1>Mesas</h1>
            <p class="intro">Estado de las cuentas abiertas por zona.</p>
        </div>
        <button id="refresh-button" class="button button-secondary" type="button">
            Actualizar datos
        </button>
    </section>
    <div id="page-message" class="message" role="alert" aria-live="polite" hidden></div>
    <p id="loading-message" class="loading-message" role="status">Cargando mesas y cuentas…</p>
    <div id="zones" class="zones" aria-live="polite"></div>
</main>
{% endblock %}
